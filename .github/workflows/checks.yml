name: checks

on:
  push:
  pull_request:

jobs:
  static-and-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: |
          python -m py_compile \
            server.py agent.py agent_state.py agent_middleware.py graph_agent.py \
            workspace.py verify.py config.py winutil.py executor_server.py schemas.py skill_registry.py prompt_loader.py package_model.py verification_modes.py mcp_server.py mcp_consent.py icpc_spec.py scoring.py judge0_adapter.py \
            eval/run_eval.py qa/stress_agent.py qa/test_phase1.py qa/test_skills.py \
            qa/test_verification_modes.py qa/test_interactive.py qa/test_hunks.py qa/test_snapshots.py qa/test_mcp.py \
            qa/test_groups_float.py qa/test_security.py qa/test_stale_export.py \
            qa/test_context_500k.py qa/test_adversarial_manifest.py qa/probe_long_context.py qa/test_stale_export.py qa/test_accessibility.py \
            qa/test_event_ledger.py qa/test_ui_contracts.py qa/test_disk_db_failure.py qa/test_icpc_spec.py \
            qa/test_group_scoring.py qa/test_testlib.py qa/test_isolate_contract.py qa/test_provider_faults.py \
            qa/test_chaos.py qa/test_judge0_adapter.py qa/soak.py
      - name: Check UI JavaScript
        run: node --check web/app.js
      - name: Run Phase 1 tests
        run: python qa/test_phase1.py
      - name: Run 500k context test
        run: python qa/test_context_500k.py
      - name: Validate adversarial manifest
        run: python qa/test_adversarial_manifest.py
      - name: Skip opt-in long-context probe in CI
        run: python qa/probe_long_context.py
      - name: Run skill tests
        run: python qa/test_skills.py
      - name: Run verification-mode tests
        run: python qa/test_verification_modes.py
      - name: Run interactive tests
        run: python qa/test_interactive.py
      - name: Run hunk tests
        run: python qa/test_hunks.py
      - name: Run snapshot tests
        run: python qa/test_snapshots.py
      - name: Run MCP tests
        run: python qa/test_mcp.py
      - name: Run group and float tests
        run: python qa/test_groups_float.py
      - name: Run security tests
        run: python qa/test_security.py
      - name: Run accessibility audit
        run: python qa/test_accessibility.py
      - name: Run stale export tests
        run: python qa/test_stale_export.py
      - name: Run event ledger tests
        run: python qa/test_event_ledger.py
      - name: Run UI contract tests
        run: python qa/test_ui_contracts.py
      - name: Run disk/db failure tests
        run: python qa/test_disk_db_failure.py
      - name: Run ICPC spec tests
        run: python qa/test_icpc_spec.py
      - name: Run group scoring tests
        run: python qa/test_group_scoring.py
      - name: Run C++ testlib fixtures
        run: python qa/test_testlib.py
      - name: Run isolate contract tests
        run: python qa/test_isolate_contract.py
      - name: Run provider fault tests
        run: python qa/test_provider_faults.py
      - name: Run chaos tests
        run: python qa/test_chaos.py
      - name: Run Judge0 adapter tests
        run: python qa/test_judge0_adapter.py
      - name: Run performance soak
        run: python qa/soak.py
      - name: Run deterministic stress suite
        run: python qa/stress_agent.py
