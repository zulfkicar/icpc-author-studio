name: checks

on:
  push:
  pull_request:

jobs:
  static-and-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: |
          python -m py_compile \
            server.py agent.py agent_state.py agent_middleware.py graph_agent.py \
            workspace.py verify.py config.py winutil.py executor_server.py \
            eval/run_eval.py qa/stress_agent.py
      - name: Check UI JavaScript
        run: node --check web/app.js
      - name: Run deterministic stress suite
        run: python qa/stress_agent.py
