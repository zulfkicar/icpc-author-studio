services:
  author-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: icpc-author-agent:local
    container_name: icpc-author-agent
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AUTHOR_AGENT_HOST: "0.0.0.0"
      AUTHOR_AGENT_API_KEY: "${AUTHOR_AGENT_API_KEY:-}"
      AUTHOR_AGENT_BASE_URL: "${AUTHOR_AGENT_BASE_URL:-}"
      AUTHOR_AGENT_MODEL: "${AUTHOR_AGENT_MODEL:-}"
      AUTHOR_AGENT_EXECUTOR_URL: "http://executor:8787"
      AUTHOR_AGENT_EXECUTOR_TOKEN: "${AUTHOR_AGENT_EXECUTOR_TOKEN:-}"
      AUTHOR_AGENT_REQUIRE_EXECUTOR: "1"
      AUTHOR_AGENT_ISOLATE_URL: "http://isolate-worker:8790"
      AUTHOR_AGENT_ISOLATE_TOKEN: "${AUTHOR_AGENT_ISOLATE_TOKEN:-}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Existing local problems, chats, plans and reports.
      - ./workspaces:/app/workspaces
      # Existing local provider settings and key (app only; never the executor).
      - ./.author-agent:/app/.author-agent
    security_opt:
      - no-new-privileges:true
    depends_on:
      executor:
        condition: service_healthy
    networks:
      - default
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: icpc-author-executor:local
    container_name: icpc-author-executor
    init: true
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    environment:
      AUTHOR_AGENT_WORKSPACES: "/app/workspaces"
      AUTHOR_AGENT_EXECUTOR_TOKEN: "${AUTHOR_AGENT_EXECUTOR_TOKEN:-}"
      AUTHOR_AGENT_EXECUTOR_SLOTS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      # The executor sees only package files. No provider key, no app state.
      - ./workspaces:/app/workspaces
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
      # bwrap needs mount namespaces; the child drops capabilities and has
      # only the temporary workspace plus read-only runtime paths.
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  isolate-worker:
    image: judge0/judge0:1.13.1
    container_name: icpc-author-isolate
    init: true
    user: "1000:999"
    command: ["/usr/local/python-3.8.1/bin/python3", "/app/isolate_worker.py"]
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      AUTHOR_AGENT_ISOLATE_TOKEN: "${AUTHOR_AGENT_ISOLATE_TOKEN:-}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./isolate_worker.py:/app/isolate_worker.py:ro
      - isolate-box:/var/local/lib/isolate
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - sandbox
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped


networks:
  sandbox:
    internal: true

volumes:
  isolate-box:
